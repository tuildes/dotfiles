- name: Home
  # hide-desktop-navigation: true
  columns:
    - size: small
      widgets:
        - type: calendar
          first-day-of-week: sunday
        - type: weather
          location: Curitiba, Brazil
          units: metric
          hour-format: 12h
        - type: clock
          hour-format: 24h
          timezones:
            - timezone: America/Sao_Paulo
              label: Brazil
            - timezone: America/Los_Angeles
              label: Cupertino

    - size: full
      widgets:
        - type: search
          search-engine: google
          autofocus: true

        - type: monitor
          cache: 1m
          title: Services
          sites:
            - title: tuildes.dev
              url: https://tuildes.dev
              icon: si:buymeacoffee
            - title: Namu
              url: https://appnamu.com
              icon: si:weread

        - type: bookmarks
          groups:
            - title: General
              links:
                - title: YouTube
                  url: https://www.youtube.com/
                - title: iCloud
                  url: https://www.icloud.com/
            - title: English
              links:
                - title: Mario Vergara
                  url: https://curso.mairovergara.com/dashboard
                - title: Graded Readers
                  url: https://gradedreaders.com/library
                - title: YouGlish
                  url: https://youglish.com/
            - title: Development
              links:
                - title: LeetCode
                  url: https://leetcode.com/problem-list/wvr5346v/
                - title: GitHub
                  url: https://github.com/tuildes

        - type: group
          widgets:
            - type: hacker-news
            - type: reddit
              subreddit: technology
              show-thumbnails: true

    - size: small
      widgets:
        - type: to-do
